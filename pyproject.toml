[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpcms-ugpass"
version = "0.1.0"
description = "RPCMS MoU e-signing workflow adapter for UGPass (sequential signatures, organisation seals, public verification)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "pydantic-settings>=2.2", "pyjwt>=2.8", "sqlalchemy>=2.0", "uvicorn>=0.27", "alembic>=1.13"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpcms_ugpass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
